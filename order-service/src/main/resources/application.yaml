server:
  port: 8081

spring:
  application:
    name: order-service
  datasource:
    url: jdbc:h2:mem:orderdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true



payment:
  service:
    url: http://localhost:8082

resilience4j:
  retry:
    instances:
      paymentService:
        # Total attempts including the first call
        max-attempts: 3
        # Fixed delay between attempts
        wait-duration: 500ms
        # Only retry on transient failures (503) — not on business errors or open-circuit exceptions
        retry-exceptions:
          - no.ikov.orderservice.infrastructure.exceptions.PaymentTransientException
        ignore-exceptions:
          - io.github.resilience4j.circuitbreaker.CallNotPermittedException
          - no.ikov.orderservice.infrastructure.exceptions.PaymentServiceException
  ratelimiter:
    instances:
      paymentService:
        # How many calls are allowed per refresh period
        limit-for-period: 5
        # The window resets every second
        limit-refresh-period: 1s
        # Don't queue — reject immediately if the limit is reached
        timeout-duration: 0
  circuitbreaker:
    instances:
      paymentService:
        # Percentage of failed calls that triggers the circuit to OPEN
        failure-rate-threshold: 50
        # Minimum number of calls required before failure rate is calculated
        # Prevents tripping on the very first call
        minimum-number-of-calls: 6
        # Number of calls tracked in the sliding window to compute the failure rate
        sliding-window-size: 6
        # How long the circuit stays OPEN before transitioning to HALF-OPEN to test recovery
        wait-duration-in-open-state: 8s
        # Number of test calls allowed in HALF-OPEN state
        # If enough succeed → CLOSED; if too many fail → back to OPEN
        permitted-number-of-calls-in-half-open-state: 3
        # COUNT_BASED: window tracks last N calls; TIME_BASED: tracks calls in last N seconds
        sliding-window-type: COUNT_BASED
        # These exceptions increment the failure counter and contribute to tripping the circuit
        record-exceptions:
          - java.lang.RuntimeException
          - java.io.IOException
          - feign.FeignException
        # These are expected business outcomes — do not count as failures
        ignore-exceptions:
          - no.ikov.orderservice.infrastructure.exceptions.OrderNotFoundException
          - no.ikov.orderservice.infrastructure.exceptions.OrderAlreadyPaidException
